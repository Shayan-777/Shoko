# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ruby-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate-engine:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Build and test offline translation engine
      run: make -C ext/shoko_translate test
    - name: Ensure no build artifacts are tracked
      run: |
        if git ls-files ext | grep -Ev '\.(c|h|md|sh)$|Makefile$' | grep -q .; then
          echo "Tracked non-source files under ext/:"
          git ls-files ext | grep -Ev '\.(c|h|md|sh)$|Makefile$'
          exit 1
        fi

  lint:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.9'
        bundler-cache: true
    - name: Run RuboCop
      run: bundle exec rubocop
    - name: Reject tracked real-book fixtures
      run: |
        if test -n "$(git ls-files testbooks)"; then
          echo "Real-book fixtures must be hosted as release assets, not tracked in Git."
          git ls-files testbooks
          exit 1
        fi

  guardrails:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.9'
        bundler-cache: true
    - name: Run guardrails lane
      run: bundle exec rake test:guardrails

  required-tests:
    needs: guardrails
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.9'
        bundler-cache: true
    - name: Run required tests lane
      run: bundle exec rake test:required

  coverage:
    needs: guardrails
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.9'
        bundler-cache: true
    - name: Enforce line and branch coverage
      run: bundle exec rake test:coverage
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ruby-coverage
        if-no-files-found: error
        path: coverage

  parser-properties:
    needs: guardrails
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.9'
        bundler-cache: true
    - name: Run parser fuzz and property tests
      run: bundle exec rake test:parser_properties
