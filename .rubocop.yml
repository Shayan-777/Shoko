inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude
    - AllowedMethods

plugins:
  - rubocop-performance

AllCops:
  # Must match the gemspec's required_ruby_version and what CI runs: a higher
  # target makes cops suggest methods the supported runtime does not have
  # (Style/ReverseFind proposed Array#rfind, which is not in 3.4).
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Include:
    - 'lib/**/*.rb'
    - 'bin/shoko'
  Exclude:
    - '.github/**/*'
    - 'spec/**/*'
    - 'script/**/*'
    - 'docs/**/*'
    - 'pkg/**/*'
    - 'test/**/*'
    - 'testbooks/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'

# Layout
Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

# Metrics
#
# Class/module length cops are disabled by constitution R2 ("length is never
# a reason to split; a long, flat, cohesive class is correct"). Method-level
# complexity cops stay on — R2 is about class/file size, not method quality.
Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/MethodLength:
  Max: 15
  CountComments: false
  AllowedMethods:
    - 'initialize'
    # Data schema definition - just a hash literal
    - 'build_initial_state'
    # Character-by-character algorithms where splitting obscures logic
    - 'sanitize'
    - 'wrap_cells'
    - 'truncate_to'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/AbcSize:
  Max: 20
  AllowedMethods:
    # Character-by-character algorithms
    - 'wrap_cells'
    - 'sanitize'
    - 'truncate_to'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Max: 8
  AllowedMethods:
    # Character-by-character algorithms - inherent complexity
    - 'sanitize'
    - 'truncate_to'
    - 'wrap_cells'
    # Type-dispatch table over the admissible state-value kinds - one branch
    # per kind is the whole point
    - 'deep_dup'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/PerceivedComplexity:
  Max: 9
  AllowedMethods:
    # Character-by-character algorithms - inherent complexity
    - 'sanitize'
    - 'truncate_to'
    - 'wrap_cells'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: false
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/BlockLength:
  Max: 35
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

# Naming
Naming/PredicateMethod:
  # Allow handler methods that return boolean for control flow
  AllowedMethods:
    - handle_overlay_click
    - handle_bar_overlay_mouse
    - handle_sidebar_interaction
    - handle_sidebar_tab_click
    - handle_sidebar_toc_click
    - handle_sidebar_wheel
    - handle_sidebar_scroll_drag
    - start_sidebar_scroll_drag
    - cancel_via_ui
    - dispatch_to_mode
    - handle
    - handle_translator_mouse_event

# Style
Style/Documentation:
  Enabled: true
  Exclude:
    - 'spec/**/*'

Style/StringLiterals:
  EnforcedStyle: single_quotes
  ConsistentQuotesInMultiline: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/GuardClause:
  Enabled: true
  MinBodyLength: 1

Style/ModuleFunction:
  Enabled: true
  EnforcedStyle: module_function

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

# Security
Security/Eval:
  Enabled: true

Security/Open:
  Enabled: true

# Performance
Performance/Count:
  Enabled: true

Performance/Detect:
  Enabled: true

# Additional cops
Lint/UselessAssignment:
  Enabled: true

Lint/DuplicateMethods:
  Enabled: true
