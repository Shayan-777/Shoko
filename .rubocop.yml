plugins:
  - rubocop-performance

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

# Layout
Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

# Metrics
Metrics/ClassLength:
  Max: 200
  CountComments: false
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/ModuleLength:
  Max: 200
  CountComments: false
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/MethodLength:
  Max: 15
  CountComments: false
  AllowedMethods:
    - 'initialize'
    # Data schema definition - just a hash literal
    - 'build_initial_state'
    # Character-by-character algorithms where splitting obscures logic
    - 'sanitize'
    - 'wrap_cells'
    - 'truncate_to'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/AbcSize:
  Max: 20
  AllowedMethods:
    # Character-by-character algorithms
    - 'wrap_cells'
    - 'sanitize'
    - 'truncate_to'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Max: 8
  AllowedMethods:
    # Character-by-character algorithms - inherent complexity
    - 'sanitize'
    - 'truncate_to'
    - 'wrap_cells'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/PerceivedComplexity:
  Max: 9
  AllowedMethods:
    # Character-by-character algorithms - inherent complexity
    - 'sanitize'
    - 'truncate_to'
    - 'wrap_cells'
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: false
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

Metrics/BlockLength:
  Max: 35
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'

# Naming
Naming/PredicateMethod:
  # Allow handler methods that return boolean for control flow
  AllowedMethods:
    - handle_overlay_click
    - handle_sidebar_interaction
    - handle_sidebar_tab_click
    - handle_sidebar_toc_click
    - handle_sidebar_wheel
    - handle_sidebar_scroll_drag
    - start_sidebar_scroll_drag
    - cancel_via_ui
    - dispatch_to_mode

# Style
Style/Documentation:
  Enabled: true
  Exclude:
    - 'spec/**/*'

Style/StringLiterals:
  EnforcedStyle: single_quotes
  ConsistentQuotesInMultiline: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/GuardClause:
  Enabled: true
  MinBodyLength: 1

Style/ModuleFunction:
  Enabled: true
  EnforcedStyle: module_function

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

# Security
Security/Eval:
  Enabled: true

Security/Open:
  Enabled: true

# Performance
Performance/Count:
  Enabled: true

Performance/Detect:
  Enabled: true

# Additional cops
Lint/UselessAssignment:
  Enabled: true

Lint/DuplicateMethods:
  Enabled: true
